name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # engines pins 22.23.1 and .npmrc sets engine-strict; keep CI in lockstep.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail on high/critical advisories (caught the vitest CVE); lower
      # severities stay visible without blocking on transient dev-dep noise.
      # pnpm-workspace.yaml's auditConfig.ignoreGhsas carries one temporary
      # exception — see docs/security-advisories.md for why.
      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright) (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official Playwright image ships all three browsers and their OS
    # libraries, so there is no apt-get step. The previous "playwright
    # install-deps" step ran apt-get in every job and took 8-12 minutes on slow
    # mirror days (vs ~20 seconds normally), which dominated whole runs. The
    # image tag must match @playwright/test in package.json (pinned exactly);
    # bump both together — the check step below fails fast if they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.61.1
    strategy:
      # One job per engine so the three run concurrently instead of serially.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright image matches the locked version
        run: |
          installed="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e container image is v$PLAYWRIGHT_IMAGE_VERSION. Update the image tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml to match."
            exit 1
          fi

      - name: Run E2E tests
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Branch protection requires a status check named "E2E (Playwright)", but
  # the job above matrixes into per-engine contexts ("E2E (Playwright)
  # (chromium)" etc.) that never post under the plain name. This job posts
  # under the exact required name once, aggregating the matrix's outcome.
  e2e-required:
    name: E2E (Playwright)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E matrix job to have succeeded
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E matrix result: ${{ needs.e2e.result }}"
            exit 1
          fi
