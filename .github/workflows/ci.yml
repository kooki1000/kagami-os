name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # engines pins 22.23.1 and .npmrc sets engine-strict; keep CI in lockstep.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # High/critical only; exceptions: docs/security-advisories.md.
      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright) (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Prebuilt browsers + OS deps (no apt-get). Keep the tag in sync with
    # @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.61.1
    strategy:
      # One job per engine, run concurrently.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright image matches the locked version
        run: |
          installed="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e container image is v$PLAYWRIGHT_IMAGE_VERSION. Update the image tag and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml to match."
            exit 1
          fi

      - name: Run E2E tests
        # Firefox won't launch from the container's default HOME.
        env:
          HOME: /root
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Posts the plain "E2E (Playwright)" check that branch protection requires.
  e2e-required:
    name: E2E (Playwright)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E matrix job to have succeeded
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E matrix result: ${{ needs.e2e.result }}"
            exit 1
          fi
